<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>IrAmp Player</title>
  <link rel="icon" href="favicon.jpg" type="image/jpeg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/winamp.css">
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash-screen" class="splash-screen">
    <div class="splash-content floating-splash">
      <h1 class="splash-title">Ну здравствуй, Ира!</h1>
      <button id="btn-splash-hello" class="splash-btn">Привет</button>
    </div>
    <!-- Fireworks container -->
    <div class="fireworks-container"></div>
  </div>

  <!-- Background Image Layer (behind blobs) -->
  <div id="bg-layer"></div>

  <!-- Blob Background (Kosmosky style) -->
  <div class="blob-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Main Player Container -->
  <div id="app">
    <div class="winamp-window minimized" id="winamp-window">
      <!-- Titlebar with Large Minimize Button -->
      <div class="winamp-titlebar">
        <span class="winamp-title">IrAmp</span>
        <div class="winamp-titlebar-buttons">
          <button id="btn-toggle-minimize" class="winamp-btn-large-minimize" title="Свернуть / Развернуть плеер">
            <span class="min-icon">🗖</span>
            <span class="min-text">Развернуть</span>
          </button>
        </div>
      </div>

      <!-- Display -->
      <div class="winamp-display">
        <div id="track-marquee">IrAmp Player</div>
        <div class="winamp-display-info">
          <span id="time-display">00:00</span>
          <!-- Мини-эквалайзер -->
          <div class="eq-bars" id="eq-bars">
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
          </div>
          <span id="duration-display">00:00</span>
          <span id="bitrate-display">128 kbps</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="winamp-controls">
        <button id="btn-prev">⏮</button>
        <button id="btn-play">▶</button>
        <button id="btn-pause" style="display:none;">⏸</button>
        <button id="btn-stop">⏹</button>
        <button id="btn-next">⏭</button>
        <button id="btn-shuffle">🔀</button>
      </div>

      <!-- Seek Bar -->
      <div class="winamp-seek-container">
        <input type="range" id="seek-bar" min="0" max="100" value="0">
      </div>

      <!-- Volume Slider -->
      <div class="winamp-volume-container">
        <input type="range" id="volume-slider" min="0" max="100" value="70">
      </div>

      <!-- Playlist -->
      <div class="winamp-playlist">
        <div id="playlist-container"></div>
      </div>
    </div>
  </div>

  <!-- Bottom Toggles Bar (Monochrome icon-only buttons) -->
  <div id="bottom-toggles-bar">
    <button id="toggle-info" class="toggle-btn toggle-info-btn" title="Справка по кнопкам">i</button>
    <button id="toggle-background" class="toggle-btn">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3l4 8 5-5 5 15H2L8 3z"/></svg>
    </button>
    <button id="toggle-triggers" class="toggle-btn active">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    </button>
    <button id="toggle-mediashow" class="toggle-btn active">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </button>
    <button id="toggle-speed" class="toggle-btn active speed-btn">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      <span id="speed-level" class="speed-level-text">2</span>
    </button>
  </div>

  <!-- Dynamic Layers -->
  <div id="mediashow-layer"></div>
  <div id="media-overlay"></div>
  <div id="screensaver-overlay">
    <canvas id="screensaver-canvas"></canvas>
  </div>



  <!-- Scripts -->
  <script src="js/tracks.js"></script>
  <script src="js/player.js"></script>
  <script src="js/mediashow.js"></script>
  <script src="js/triggers.js"></script>
  <script src="js/screensaver.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
