<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Winamp Pastel Player</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/winamp.css">
</head>
<body>

  <!-- Blob Background (Kosmosky style) -->
  <div class="blob-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Main Player Container -->
  <div id="app">
    <div class="winamp-window" id="winamp-window">
      <!-- Titlebar with Large Minimize Button -->
      <div class="winamp-titlebar">
        <span class="winamp-title">WINAMP</span>
        <div class="winamp-titlebar-buttons">
          <button id="btn-toggle-minimize" class="winamp-btn-large-minimize" title="Свернуть / Развернуть плеер">
            <span class="min-icon">🗕</span>
            <span class="min-text">Свернуть</span>
          </button>
        </div>
      </div>

      <!-- Display -->
      <div class="winamp-display">
        <div id="track-marquee">Winamp Pastel Player</div>
        <div class="winamp-display-info">
          <span id="time-display">00:00</span>
          <span id="duration-display">00:00</span>
          <span id="bitrate-display">128 kbps</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="winamp-controls">
        <button id="btn-prev" title="Previous">⏮</button>
        <button id="btn-play" title="Play">▶</button>
        <button id="btn-pause" title="Pause" style="display:none;">⏸</button>
        <button id="btn-stop" title="Stop">⏹</button>
        <button id="btn-next" title="Next">⏭</button>
        <button id="btn-shuffle" title="Shuffle">🔀</button>
        <button id="btn-screensaver" title="Screensaver Mode">📺</button>
      </div>

      <!-- Seek Bar -->
      <div class="winamp-seek-container">
        <input type="range" id="seek-bar" min="0" max="100" value="0">
      </div>

      <!-- Volume Slider -->
      <div class="winamp-volume-container">
        <input type="range" id="volume-slider" min="0" max="100" value="70">
      </div>

      <!-- Playlist -->
      <div class="winamp-playlist">
        <div id="playlist-container"></div>
      </div>
    </div>
  </div>

  <!-- Bottom Toggles Bar (3 grey toggle buttons) -->
  <div id="bottom-toggles-bar">
    <button id="toggle-screensaver" class="toggle-btn active" title="Скринсейвер: Вкл/Выкл">
      <span class="toggle-icon">📺</span>
      <span class="toggle-text">Скринсейвер</span>
    </button>
    <button id="toggle-triggers" class="toggle-btn active" title="Эмодзи и надписи: Вкл/Выкл">
      <span class="toggle-icon">💬</span>
      <span class="toggle-text">Эмодзи</span>
    </button>
    <button id="toggle-mediashow" class="toggle-btn active" title="Фото и видео: Вкл/Выкл">
      <span class="toggle-icon">🖼️</span>
      <span class="toggle-text">Медиа</span>
    </button>
  </div>

  <!-- Dynamic Layers -->
  <div id="mediashow-layer"></div>
  <div id="media-overlay"></div>
  <div id="screensaver-overlay">
    <canvas id="screensaver-canvas"></canvas>
  </div>

  <!-- Scripts -->
  <script src="js/player.js"></script>
  <script src="js/triggers.js"></script>
  <script src="js/screensaver.js"></script>
  <script src="js/mediashow.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
