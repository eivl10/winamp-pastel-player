<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Winamp Pastel Player</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/winamp.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

  <!-- Blob Background (Kosmosky style) -->
  <div class="blob-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- iOS Unlock Screen -->
  <div id="ios-unlock-screen" style="display: none;">
    <button id="ios-start-btn">Нажми чтобы начать ▶</button>
  </div>

  <!-- Main Player Container -->
  <div id="app">
    <div class="winamp-window">
      <!-- Titlebar -->
      <div class="winamp-titlebar">
        <span class="winamp-title">WINAMP</span>
        <div class="winamp-titlebar-buttons">
          <button class="winamp-btn-minimize" aria-label="Minimize"></button>
          <button class="winamp-btn-close" aria-label="Close"></button>
        </div>
      </div>

      <!-- Display -->
      <div class="winamp-display">
        <div id="track-marquee">Winamp Pastel Player</div>
        <div class="winamp-display-info">
          <span id="time-display">00:00</span>
          <span id="duration-display">00:00</span>
          <span id="bitrate-display">128 kbps</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="winamp-controls">
        <button id="btn-prev" title="Previous">⏮</button>
        <button id="btn-play" title="Play">▶</button>
        <button id="btn-pause" title="Pause">⏸</button>
        <button id="btn-stop" title="Stop">⏹</button>
        <button id="btn-next" title="Next">⏭</button>
        <button id="btn-shuffle" title="Shuffle">🔀</button>
        <button id="btn-screensaver" title="Screensaver">📺</button>
      </div>

      <!-- Seek Bar -->
      <div class="winamp-seek-container">
        <input type="range" id="seek-bar" min="0" max="100" value="0">
      </div>

      <!-- Volume Slider -->
      <div class="winamp-volume-container">
        <input type="range" id="volume-slider" min="0" max="100" value="70">
      </div>

      <!-- Playlist -->
      <div class="winamp-playlist">
        <div id="playlist-container"></div>
      </div>
    </div>
  </div>

  <div id="mediashow-layer" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 50; pointer-events: none;"></div>

  <!-- Media Overlay for Triggers -->
  <div id="media-overlay" style="position: fixed; z-index: 500;"></div>

  <!-- Screensaver Overlay -->
  <div id="screensaver-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; background: transparent;">
    <canvas id="screensaver-canvas" style="width:100%;height:100%;"></canvas>
  </div>

  <!-- JavaScript Scripts -->
  <script src="js/player.js"></script>
  <script src="js/triggers.js"></script>
  <script src="js/screensaver.js"></script>
  <script src="js/mediashow.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
